name: debug-native-logs
on:
  push:
    paths: ['.debug-bridge*.txt']
permissions:
  actions: read
  contents: write
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib, zipfile, io, os
          run_id = pathlib.Path('.debug-bridge.txt').read_text().strip()
          req = urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{run_id}/artifacts', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
          items = json.load(urllib.request.urlopen(req))['artifacts']
          out = pathlib.Path('.ci-logs')
          out.mkdir(exist_ok=True)
          for item in items:
              req = urllib.request.Request(item['archive_download_url'], headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              raw = urllib.request.urlopen(req).read()
              z = zipfile.ZipFile(io.BytesIO(raw))
              print('FILES', item['name'], z.namelist())
              for n in z.namelist():
                  if n in ('build.log', 'build.json', 'gradle.log', 'l3', 'build-receipt.json'):
                      p = out / (run_id + '-' + n)
                      p.write_bytes(z.read(n))
                      print('EXTRACTED', p, len(p.read_bytes()))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-logs
          git diff --cached --quiet || git commit -m "ci: capture native logs ${GITHUB_RUN_ID}"
          git push
        env:
          GH_TOKEN: ${{ github.token }}
