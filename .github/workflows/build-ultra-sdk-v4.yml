name: build-ultra-sdk-v4

on:
  workflow_dispatch:
  push:
    paths:
      - ".ultra-sdk-v4-trigger/**"

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: 取上游 MapleSU 源码
        run: |
          set -euo pipefail
          mkdir -p src
          UPSTREAM_COMMIT=ff3aa44850ea22717fa811a17831155a85f43445
          curl -L --retry 5 --retry-delay 10 -o /tmp/maplesu.tar.gz "https://codeload.github.com/FengQiuFQ/MapleSU/tar.gz/${UPSTREAM_COMMIT}"
          tar xzf /tmp/maplesu.tar.gz -C src --strip-components=1
          test -d src/runtime/maplesu-sdk/sdk
          test -f src/runtime/maplesu-sdk/sdk/manifest.jsonl
      - name: 安装 NDK / CMake
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f | head -1)
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          for pkg in "ndk;29.0.14206865" "cmake;3.22.1"; do
            "$SM" "$pkg" < /dev/null || true
          done
          test -d "$SDK/ndk/29.0.14206865"
          echo "ANDROID_NDK_HOME=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$SDK/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - name: 放宽 compose 阶段继承的 -Werror（NDK 29 新警告不阻断归档重建）
        run: |
          set -euo pipefail
          cd src
          python3 - <<'PY'
          from pathlib import Path
          p = Path("runtime/maplesu-sdk/sdk/build.py")
          s = p.read_text(encoding="utf-8")
          needle = 'flags = _step_flags(argv, drop)\n        flags.insert(0, "--target=aarch64-linux-android21")'
          if s.count(needle) != 1:
              raise SystemExit(f"FATAL: compose -Werror marker count={s.count(needle)}")
          s = s.replace(needle, 'flags = _step_flags(argv, drop)\n        flags = [flag for flag in flags if flag != "-Werror"]\n        flags.insert(0, "--target=aarch64-linux-android21")')
          p.write_text(s, encoding="utf-8")
          print("compose -Werror relaxed")
          PY
      - name: 重建 Ultra SDK archive（reference payloads，不覆盖参考归档）
        run: |
          set -euo pipefail
          cd src
          ln -sfn "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64" "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/windows-x86_64"
          mkdir -p /tmp/bw-sdk
          python3 runtime/maplesu-sdk/sdk/build.py \
            --reference-payloads --compile --compose --pack \
            --ndk "$ANDROID_NDK_HOME" \
            --build-dir /tmp/bw-sdk \
            --jobs 4 2>&1 | tee /tmp/sdk-v4-build.log
          test -s /tmp/bw-sdk/out/libkernel_module_kit_static.a
          ls -lh /tmp/bw-sdk/out/libkernel_module_kit_static.a
      - name: 校验 Ultra API 符号
        run: |
          set -euo pipefail
          NM=$(find "$ANDROID_NDK_HOME" -name llvm-nm -type f | head -1)
          "$NM" -C --defined-only /tmp/bw-sdk/out/libkernel_module_kit_static.a > /tmp/sdk-symbols.txt
          for sym in 'kernel_module::maplesu_request_auth_state()' 'kernel_module::maplesu_request_set_auth_mode' 'maplesu::sdk::install_maplesu_environment' 'maplesu::sdk::get_sdk_version()' 'maplesu::sdk::run_root_cmd' 'maplesu::su_auth::add' 'maplesu::su_auth::get_uid_profiles_with_cb'; do
            grep -F "$sym" /tmp/sdk-symbols.txt > /dev/null || { echo "FATAL: missing $sym"; exit 1; }
          done
          echo "Ultra SDK symbols OK"
      - name: 保存诊断和归档
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p .ci-logs
          cp /tmp/sdk-v4-build.log .ci-logs/sdk-v4-build.log
          cp /tmp/sdk-symbols.txt .ci-logs/sdk-v4-symbols.txt
          if [ -f /tmp/bw-sdk/report/build-report.json ]; then cp /tmp/bw-sdk/report/build-report.json .ci-logs/sdk-v4-report.json; fi
          if [ -f /tmp/bw-sdk/report/MANIFEST-COVERAGE.md ]; then cp /tmp/bw-sdk/report/MANIFEST-COVERAGE.md .ci-logs/sdk-v4-coverage.md; fi
          mkdir -p runtime/maplesu-sdk/lib/arm64-v8a
          cp /tmp/bw-sdk/out/libkernel_module_kit_static.a runtime/maplesu-sdk/lib/arm64-v8a/libkernel_module_kit_static.a
          sha256sum runtime/maplesu-sdk/lib/arm64-v8a/libkernel_module_kit_static.a | tee .ci-logs/sdk-v4-archive-sha256.txt
      - name: 失败时把日志写回仓库
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          cp /tmp/sdk-v4-build.log .ci-logs/sdk-v4-build.log 2>/dev/null || true
          cp /tmp/bw-sdk/logs/compose-m0081-*.log .ci-logs/ 2>/dev/null || true
          if [ -f /tmp/bw-sdk/report/build-report.json ]; then cp /tmp/bw-sdk/report/build-report.json .ci-logs/sdk-v4-report.json; fi
          if [ -f /tmp/bw-sdk/report/MANIFEST-COVERAGE.md ]; then cp /tmp/bw-sdk/report/MANIFEST-COVERAGE.md .ci-logs/sdk-v4-coverage.md; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-logs || true
          git commit -m "ci: sdk v4 failure diagnostics" || true
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ultra-sdk-v4
          path: |
            /tmp/bw-sdk/out/libkernel_module_kit_static.a
            /tmp/sdk-symbols.txt
            /tmp/sdk-v4-build.log
            /tmp/bw-sdk/report/build-report.json
          if-no-files-found: warn
      - name: 提交 archive 回分支
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-logs runtime/maplesu-sdk/lib/arm64-v8a/libkernel_module_kit_static.a
          git commit -m "sdk: rebuild Ultra SDK archive with maplesu::sdk and su_auth symbols" || true
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
