name: build-bluewhale

# 在 GitHub 的 16G 跑构建机上出包：本机只有 4G，Kotlin 编译这个体量的 App 会被内存上限杀掉。
# 构建日志通过 Contents API 写回 ci-logs/last-build.md（GITHUB_TOKEN 提交不会触发新 workflow）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "bw-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游 MapleSU 源码
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          curl -sSL -o /tmp/maplesu.tar.gz \
            https://codeload.github.com/FengQiuFQ/MapleSU/tar.gz/refs/heads/main
          mkdir -p src
          tar xzf /tmp/maplesu.tar.gz -C src --strip-components=1
          echo "上游体积: $(du -sh src | cut -f1)"

      - name: 应用蓝鱼品牌化补丁
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          python3 overlay/apply_bluewhale.py src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 工具链 + 编译（单脚本）
        run: |
          set -euxo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          echo "== java =="; java -version
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"; ls "$SDK" || true
          ls "$SDK/cmdline-tools" || true
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(find "$SDK" -name sdkmanager -type f | head -1); fi
          echo "SM=$SM"
          yes | "$SM" --licenses || true
          for pkg in "platforms;android-37.0" "platforms;android-37" "build-tools;37.0.0" \
                     "platforms;android-36" "build-tools;36.0.0" \
                     "cmake;3.22.1" "ndk;26.1.10909125"; do
            echo "--- install $pkg"
            "$SM" "$pkg" || true
          done
          ls "$SDK/platforms"
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pyelftools==0.32 unicorn==2.1.4
          rustup toolchain install stable --profile minimal || true
          export PATH="$HOME/.cargo/bin:$PATH"
          rustc --version || true
          cd src
          ./gradlew --no-daemon --max-workers=4 \
            --dependency-verification=off \
            -PbluewhaleSkipSdkVerify=true \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :manager:assembleRelease

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out ci-logs
          find src/manager/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out || true
          (cd out && sha256sum *.apk > SHA256SUMS.txt) 2>/dev/null || true
          {
            echo "# 构建结果";
            echo;
            echo "- run: ${{ github.run_number }}  提交: ${{ github.sha }}";
            echo "- 作业结论: ${{ job.status }}";
            echo;
            echo '```';
            tail -600 build.log 2>/dev/null || echo "(无 build.log)";
            echo '```';
          } > ci-logs/last-build.md
          wc -c ci-logs/last-build.md

      - name: 日志写回仓库（Contents API）
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -uo pipefail
          [ -f ci-logs/last-build.md ] || exit 0
          B64=$(base64 -w0 ci-logs/last-build.md)
          API="https://api.github.com/repos/$REPO/contents/ci-logs/last-build.md"
          SHA=$(curl -s -H "Authorization: Bearer $TOKEN" "$API?ref=main" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          if [ -n "$SHA" ]; then EXTRA=",\"sha\":\"$SHA\""; else EXTRA=""; fi
          printf '{"message":"ci: 构建日志 run %s","content":"%s","branch":"main"%s}' \
            "$RUN_NO" "$B64" "$EXTRA" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API" -d @/tmp/payload.json | head -c 300

      - name: 发布 APK（成功才发）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bw-${{ github.run_number }}
          name: BlueWhale ${{ github.run_number }}
          body: |
            蓝色大肥鱼 · MapleSU 基座构建
            - 包名 com.blue.whale.mask
            - 版本 3.17.0-bw
            - 未签名包，本地用 bluewhale-release.p12 签名后安装
          files: |
            out/*.apk
            out/SHA256SUMS.txt
