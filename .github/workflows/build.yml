name: build-bluewhale

# 在 GitHub 的 16G 跑构建机上出包：本机只有 4G，Kotlin 编译这个体量的 App 会被内存上限杀掉。
# 构建日志通过 Contents API 写回 ci-logs/last-build.md。
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "bw-*"

permissions:
  contents: write

# 同一个仓库只跑一轮：新提交直接顶掉旧 run，不用两个 150 分钟的作业互相抢。
concurrency:
  group: build-bluewhale
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 拉取上游 MapleSU 源码
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          curl -sSL -o /tmp/maplesu.tar.gz \
            https://codeload.github.com/FengQiuFQ/MapleSU/tar.gz/refs/heads/main
          mkdir -p src
          tar xzf /tmp/maplesu.tar.gz -C src --strip-components=1
          echo "上游体积: $(du -sh src | cut -f1)"

      - name: 应用蓝鱼品牌化补丁
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          python3 overlay/apply_bluewhale.py src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 工具链 + 编译（单脚本）
        run: |
          set -euxo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1
          echo "== java =="; java -version
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM=$(find "$SDK" -name sdkmanager -type f | head -1); fi
          echo "SM=$SM"
          # 预先接受标准 license：sdkmanager 在非 tty 环境会因交互提示挂住（run-8 教训）
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          echo "licenses 已预写: $(ls "$SDK/licenses")"
          # provider 构建（jailbreak-providers/build.py）写死 ndk/28.2.13676358；
          # 缺这个 NDK 会让所有 KMI 模块编译失败并回退原厂载荷（run-9 教训）。
          for pkg in "platforms;android-37.0" "platforms;android-37" "build-tools;37.0.0" \
                     "platforms;android-36" "build-tools;36.0.0" \
                     "cmake;3.22.1" "ndk;28.2.13676358" "ndk;29.0.14206865"; do
            echo "--- install $pkg"
            "$SM" "$pkg" < /dev/null || true
          done
          echo "== platforms =="; ls "$SDK/platforms"
          echo "== ndk =="; ls "$SDK/ndk"
          test -d "$SDK/ndk/28.2.13676358" || { echo "FATAL: ndk 28.2 未安装"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          python3 -m pip install --upgrade pip || true
          python3 -m pip install pyelftools==0.32 unicorn==2.1.4
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal || true
          rustc --version || true
          # ghostlock 的 Rust 提取器用 `cargo build --offline --locked` 构建（run-13 教训）；
          # 空缓存下 --offline 必然找不到 crate，先联网把依赖落到 ~/.cargo，再交给离线构建。
          rustup target add aarch64-linux-android --toolchain stable || true
          EXTRACTOR="$GITHUB_WORKSPACE/src/jailbreak-providers/ghostlock/extractor-native/Cargo.toml"
          if [ -f "$EXTRACTOR" ]; then
            cargo fetch --manifest-path "$EXTRACTOR" || { echo "FATAL: cargo fetch 失败"; exit 1; }
            ls "$HOME/.cargo/registry" || true
          fi
          # l3 模块在 gradle 之前就要用 Kotlin 宿主编译（tools/specgen），它按 gradle 缓存布局找
          # kotlin-stdlib / kotlin-compiler-embeddable / kotlinx-serialization 等 15 个 jar（run-18 教训）。
          # 上游自带 prepare_host_dependencies.py，直接按锁文件落到 ~/.gradle。
          python3 "$GITHUB_WORKSPACE/src/tools/prepare_host_dependencies.py" \
            --lock "$GITHUB_WORKSPACE/src/tools/host-jvm-dependencies.json" \
            --gradle-user-home "$HOME/.gradle"
          python3 --version
          cd src
          ./gradlew --no-daemon --max-workers=4 \
            --dependency-verification=off \
            -PbluewhaleSkipSdkVerify=true \
            -PmaplesuPython="$(command -v python3)" \
            -PmaplesuUltraviderNdk="$SDK/ndk/28.2.13676358" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :manager:assembleRelease

      - name: 收集产物
        if: always()
        run: |
          mkdir -p out ci-logs
          find src/manager/build/outputs/apk -name "*.apk" -exec cp {} out/ \; || true
          ls -lh out || true
          (cd out && sha256sum *.apk > SHA256SUMS.txt) 2>/dev/null || true
          {
            echo "# 构建结果";
            echo;
            echo "- run: ${{ github.run_number }}  提交: ${{ github.sha }}";
            echo "- 作业结论: ${{ job.status }}";
            echo;
            echo "#### 补丁摘要（是否真应用）";
            grep -E "改好|修好|插入|注意|补丁|失败" build.log 2>/dev/null | head -40 || echo "(无补丁输出)";
            echo;
            echo "#### gradle 失败原因";
            grep -nE "What went wrong|FAILURE|Caused by|Execution failed|> Task .*FAILED|error:" build.log 2>/dev/null | tail -30 || echo "(无失败行)";
            echo;
            echo '```';
            echo "#### provider 子构建日志（CMake/cargo 报错常只写在这里）";
            for j in $(find src/manager/build/jailbreakProviders -maxdepth 2 -name build.json 2>/dev/null | head -4); do
              echo "--- $j";
              python3 -c "import json;d=json.load(open('$j'));e=(d.get('ir') or {}).get('error');print(e or json.dumps({k:d.get(k) for k in ('ok','errors','failure')},ensure_ascii=False)[:300])" 2>/dev/null || true;
            done;
            find src -name "build.log" -size -4M 2>/dev/null | head -3 | while read -r f; do
              echo "===== $f =====";
              tail -120 "$f";
            done;
            echo "#### 主构建日志尾";
            tail -500 build.log 2>/dev/null || echo "(无 build.log)";
            echo '```';
          } > ci-logs/last-build.md
          wc -c ci-logs/last-build.md

      - name: 日志写回仓库（Contents API）
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NO: ${{ github.run_number }}
        run: |
          set -uo pipefail
          [ -f ci-logs/last-build.md ] || exit 0
          B64=$(base64 -w0 ci-logs/last-build.md)
          API="https://api.github.com/repos/$REPO/contents/ci-logs/last-build.md"
          SHA=$(curl -s -H "Authorization: Bearer $TOKEN" "$API?ref=main" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || true)
          if [ -n "$SHA" ]; then EXTRA=",\"sha\":\"$SHA\""; else EXTRA=""; fi
          printf '{"message":"ci: 构建日志 run %s","content":"%s","branch":"main"%s}' \
            "$RUN_NO" "$B64" "$EXTRA" > /tmp/payload.json
          curl -s -X PUT -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
            "$API" -d @/tmp/payload.json | head -c 300

      - name: 发布 APK（成功才发）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bw-${{ github.run_number }}
          name: BlueWhale ${{ github.run_number }}
          body: |
            蓝色大肥鱼 · MapleSU 基座构建
            - 包名 com.blue.whale.mask
            - 版本 3.17.0-bw
            - 未签名包，本地用 bluewhale-release.p12 签名后安装
          files: |
            out/*.apk
            out/SHA256SUMS.txt
