name: build-bluewhale-native

# 3.22.0（32739）的门禁：APK 里的 native 载荷必须按新包名重编，否则管理器只能修 UI、修不到 root。
#
# 为什么不能只跑 :manager:assembleRelease：
#   上游把 libksud_ksu.so 作为预编译二进制提交在 manager/src/main/jniLibs/arm64-v8a/，
#   只跑 assembleRelease 等于原样复制它——manifest/Kbuild/build.rs 的改动不会进去。
#   所以这里按上游 build-normal.yml 的顺序，先重编 ko（Docker DDK）、再编 ksud、再生成 JNI 与 payload，
#   最后才 assembleRelease。
#
# 首次运行预计 90–150 分钟（6 个 KMI 的 LKM 是主要耗时）。失败时看最后一步上传的日志。

on:
  workflow_dispatch:
    inputs:
      skip_lkm:
        description: "跳过 LKM 重编，复用上次下载好的 lkm 目录（调试用）"
        type: boolean
        default: false
      target:
        description: "构建哪一版：32737=3.20.1；32738=3.21.0 数据层；32739=3.22.0 品牌+诊断"
        type: choice
        options:
          - "32737"
          - "32738"
          - "32739"
        default: "32739"
  push:
    paths:
      - ".ci-trigger/**"

permissions:
  contents: read

concurrency:
  group: build-bluewhale-native-${{ inputs.target || 'push' }}
  cancel-in-progress: false

env:
  KSU_PACKAGE_NAME: "com.blue.whale.mask"
  KSU_EXPECTED_SIZE: "1355"
  KSU_EXPECTED_HASH: "863878da8763d51c8316a81bdec40b6f9fdee236ff00db987e09d4a3f0434581"
  DDK_RELEASE: "20260828"
  RUSTUP_TOOLCHAIN: "1.99.1"
  MAPLESU_RUST_TOOLCHAIN: "1.99.1"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  KMI_MATRIX: "android12-5.10 android13-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18"

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 取本仓库
        uses: actions/checkout@v4

      - name: 应用 DSH 32739 源码（排除 workflow）
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/32739-dsh.patch https://aka.doubaocdn.com/s/MmSBQklfMU
          echo "ea8f4d00f7a6088298e4d44646070604d340d7395f17c54b8ffd924c4dc1dc24  /tmp/32739-dsh.patch" | sha256sum -c -
          git apply --whitespace=nowarn --exclude='.github/**' /tmp/32739-dsh.patch

      - name: 解析目标版本（push 触发读 .ci-trigger/target）
        id: target
        run: |
          if [ -f .ci-trigger/target ]; then
            TARGET=$(tr -d '[:space:]' < .ci-trigger/target)
          else
            TARGET="${{ inputs.target || '32737' }}"
          fi
          case "$TARGET" in
            32737|32738|32739) ;;
            *) echo "FATAL: invalid target=$TARGET"; exit 1 ;;
          esac
          echo "resolved target=$TARGET"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: 取上游 MapleSU 源码
        run: |
          set -euo pipefail
          mkdir -p src
          UPSTREAM_COMMIT=ff3aa44850ea22717fa811a17831155a85f43445
          echo "upstream commit=$UPSTREAM_COMMIT"
          curl -sSL -o /tmp/maplesu.tar.gz "https://codeload.github.com/FengQiuFQ/MapleSU/tar.gz/${UPSTREAM_COMMIT}"
          tar xzf /tmp/maplesu.tar.gz -C src --strip-components=1
          echo "上游体积: $(du -sh src | cut -f1)"

      - name: 按 32739 完整链打补丁
        run: |
          set -euo pipefail
          python3 overlay/apply_bluewhale.py src
          python3 overlay/patch_runtime_targets.py src
          python3 overlay/patch_brand_skin_tail.py src
          python3 overlay/patch_bluewhale_320.py src
          python3 overlay/patch_bluewhale_321.py src
          python3 overlay/patch_bluewhale_323.py src
          if [ "${{ steps.target.outputs.target }}" = "32738" ] || [ "${{ steps.target.outputs.target }}" = "32739" ]; then
            python3 overlay/patch_bluewhale_3210.py src
          else
            echo "target=${{ steps.target.outputs.target }}：跳过 3210"
          fi
          if [ "${{ steps.target.outputs.target }}" = "32739" ]; then
            python3 overlay/patch_bluewhale_322.py src
            python3 overlay/patch_bluewhale_32739.py src
            python3 overlay/patch_bluewhale_32739_root.py src
          fi
          echo "== 关键身份确认 =="
          python3 - <<'PY'
          import json
          m = json.load(open('src/third_party/kernelsu/manifest.json'))
          ident = m['identity']
          assert ident['packageName'] == ident['managerPackage'] == 'com.blue.whale.mask', ident
          ident['expectedSize'] = 1355
          ident['expectedHash'] = '863878da8763d51c8316a81bdec40b6f9fdee236ff00db987e09d4a3f0434581'
          ident['expectedNote'] = 'BlueWhale release cert DER (1355 bytes)'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'src/third_party/kernelsu/scripts')
          import ksu_common as C
          m['applied']['treeSha256'] = C.tree_sha256(C.APPLIED_DIR)
          m['applied']['fileCount'] = len(C.iter_tree_files(C.APPLIED_DIR))
          m['upstream']['treeSha256'] = C.tree_sha256(C.UPSTREAM_DIR)
          m['upstream']['fileCount'] = len(C.iter_tree_files(C.UPSTREAM_DIR))
          pj = Path('src/third_party/kernelsu/patches/7k/patches.json')
          pt = pj.read_text(encoding='utf-8')
          pt = pt.replace('"KSU_MANAGER_PACKAGE ?= dev.maplesu.manager"',
                          '"KSU_MANAGER_PACKAGE ?= com.blue.whale.mask"')
          pt = pt.replace('"cargo:rustc-env=KSU_PACKAGE_NAME=dev.maplesu.manager"',
                          '"cargo:rustc-env=KSU_PACKAGE_NAME=com.blue.whale.mask"')
          pj.write_text(pt, encoding='utf-8')
          open('src/third_party/kernelsu/manifest.json', 'w', encoding='utf-8').write(
              json.dumps(m, ensure_ascii=False, indent=2) + '\n')
          print('identity ok:', ident['packageName'], ident['expectedSize'], ident['expectedHash'][:16])
          print('appliedTreeSha256:', m['applied']['treeSha256'], 'files:', m['applied']['fileCount'])
          PY

      - name: 安装构建工具链（NDK 26/29 / cmake / Rust 1.99.1 / libclang）
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install pyelftools==0.32 unicorn==2.1.4
          python3 -c 'import importlib.metadata; assert importlib.metadata.version("unicorn") == "2.1.4"'
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK" -name sdkmanager -type f | head -1)
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          for pkg in "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-37.0" "build-tools;37.0.0"; do
            echo "--- install $pkg"
            "$SM" "$pkg" < /dev/null || true
          done
          test -d "$SDK/ndk/26.1.10909125" || { echo "FATAL: ndk 26 未安装"; exit 1; }
          test -d "$SDK/ndk/29.0.14206865" || { echo "FATAL: ndk 29 未安装"; exit 1; }
          test -d "$SDK/build-tools/37.0.0" || { echo "FATAL: build-tools 37 未安装"; exit 1; }
          test -d "$SDK/platforms/android-37" || test -d "$SDK/platforms/android-37.0" || { echo "FATAL: platform 37 未安装"; exit 1; }
          if [ -d "$SDK/platforms/android-37.0" ] && [ ! -e "$SDK/platforms/android-37" ]; then
            ln -s "$SDK/platforms/android-37.0" "$SDK/platforms/android-37"
          fi
          echo "== installed platforms =="; ls -d "$SDK/platforms/"* 2>/dev/null || true
          echo "ANDROID_NDK_HOME=$SDK/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "CMAKE_BIN=$SDK/cmake/3.22.1/bin/cmake" >> "$GITHUB_ENV"
          echo "$SDK/cmake/3.22.1/bin" >> "$GITHUB_PATH"
          ln -sf "$SDK/cmake/3.22.1/bin/cmake" "$SDK/cmake/3.22.1/bin/cmake.exe"
          ln -sf "$SDK/cmake/3.22.1/bin/ninja" "$SDK/cmake/3.22.1/bin/ninja.exe"
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target aarch64-linux-android
          cargo fetch --locked --manifest-path src/third_party/kernelsu/applied/Cargo.toml
          cargo fetch --locked --manifest-path src/jailbreak-providers/ghostlock/extractor-native/Cargo.toml

      - name: 装 JDK 21（assembleRelease 用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 按 KMI 重编内核模块（Docker DDK）
        if: ${{ !inputs.skip_lkm }}
        run: |
          set -euo pipefail
          cd src
          for kmi in $KMI_MATRIX; do
            echo "===== $kmi ====="
            image="ghcr.io/ylarod/ddk-min:${kmi}-${DDK_RELEASE}"
            docker pull "$image"
            bash third_party/kernelsu/scripts/build_lkm.sh --kmi "$kmi" --ddk-image "$image" \
              2>&1 | tee "third_party/kernelsu/lkm/${kmi}_kernelsu.log"
            if KMI="$kmi" python3 -c 'import os,sys; sys.path.insert(0,"third_party/kernelsu/scripts"); import ksu_common as C; sys.exit(0 if os.environ["KMI"] in C.COMPATIBILITY_KMI_MATRIX else 1)'; then
              bash third_party/kernelsu/scripts/build_lkm.sh --kmi "$kmi" --ddk-image "$image" --vr-only \
                2>&1 | tee "third_party/kernelsu/lkm/${kmi}_maplesu_vr.log"
            fi
          done
          ls -l third_party/kernelsu/lkm/*.ko
          echo "== ko 里必须已是新包名 =="
          for ko in third_party/kernelsu/lkm/*.ko; do
            new=$(grep -a -c "com.blue.whale.mask" "$ko" || true)
            old=$(grep -a -c "dev.maplesu.manager" "$ko" || true)
            echo "$(basename "$ko")  新 $new / 旧 $old"
            [ "$old" = "0" ] || { echo "FATAL: $ko 仍含旧包名"; exit 1; }
          done

      - name: 重编 ksud 与 JNI，生成并校验 payload
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          cd src
          bash third_party/kernelsu/scripts/build_userland.sh --kmi all 2>&1 | tee /tmp/userland.log
          bash third_party/kernelsu/scripts/build_jni.sh 2>&1 | tee /tmp/jni.log
          for asset in third_party/kernelsu/artifacts/{ksuinit,maplesu_vrinit} third_party/kernelsu/lkm/*.ko; do
            [ -f "$asset" ] || continue
            python3 third_party/kernelsu/scripts/verify_embedded_asset.py --asset "$asset" --deep
          done
          TREE=$(python3 -c 'import sys; sys.path.insert(0,"third_party/kernelsu/scripts"); import ksu_common as C; print(C.tree_sha256(C.APPLIED_DIR))')
          echo "appliedTreeSha256=$TREE"
          python3 third_party/kernelsu/scripts/gen_payload.py --built-source-tree "$TREE"
          python3 third_party/kernelsu/scripts/verify_payload.py --quick 2>&1 | tee /tmp/payload-gate.log
          python3 third_party/kernelsu/scripts/gen_payload.py --check

      - name: 编 release APK
        run: |
          set -euo pipefail
          cd src
          set -o pipefail
          ./gradlew --no-daemon --max-workers=4 \
            --dependency-verification=off \
            --stacktrace \
            -PbluewhaleSkipSdkVerify=true \
            -PmaplesuPython="$(command -v python3)" \
            -PmaplesuUltraviderNdk="$ANDROID_HOME/ndk/29.0.14206865" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :manager:assembleRelease 2>&1 | tee /tmp/gradle.log

      - name: 失败时打印 jailbreak 与 Gradle 日志
        if: failure()
        run: |
          mkdir -p out
          echo "== java =="
          java -version 2>&1 || true
          echo "== gradle version =="
          (cd src && ./gradlew --version) 2>&1 | head -30 || true
          echo "== jailbreakProviders/build.log =="
          cat src/manager/build/jailbreakProviders/build.log 2>/dev/null || true
          echo "== jailbreakProviders/build.json =="
          cat src/manager/build/jailbreakProviders/build.json 2>/dev/null || true
          echo "== gradle tail =="
          tail -120 /tmp/gradle.log 2>/dev/null || true
          cp /tmp/gradle.log out/gradle.log 2>/dev/null || true

      - name: 生成构建回执并执行六 KMI 与 L3 硬门禁
        if: always()
        run: |
          set -euo pipefail
          mkdir -p out
          APK=$(ls src/manager/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then echo "没有产物，跳过回执"; exit 0; fi
          cp "$APK" out/
          python3 tools/bluewhale_receipt.py "$APK" -o out/build-receipt.json
          python3 - "$APK" "${{ steps.target.outputs.target }}" <<'PY'
          import json, sys, zipfile, hashlib
          apk_path = sys.argv[1]
          requested_target = sys.argv[2] or "32737"
          expected = {
              "32737": (32737, "3.20.1-bw"),
              "32738": (32738, "3.21.0-bw"),
              "32739": (32739, "3.22.0-bw"),
          }.get(requested_target)
          if expected is None:
              raise SystemExit(f"FATAL: unsupported target {requested_target}")
          receipt = json.load(open("out/build-receipt.json"))
          native = receipt["native"]
          required = ["android12-5.10", "android13-5.15", "android14-6.1", "android15-6.6", "android16-6.12", "android17-6.18"]
          so_old = native.get("soOldPackageCount", 0)
          rows = native["kmis"]
          bad = [row for row in rows if row["oldPackageCount"] > 0 or row["newPackageCount"] == 0]
          identity_ok = (receipt.get("packageName") == "com.blue.whale.mask"
                         and receipt.get("versionCode") == expected[0]
                         and receipt.get("versionName") == expected[1])
          print(f"identity={identity_ok} coverageOk={native['coverageOk']} soOldPackageCount={so_old} 主KO异常={len(bad)}")
          provider = json.load(open("src/manager/build/jailbreakProviders/build.json"))
          if provider.get("exitCode") != 0:
              raise SystemExit("FATAL: jailbreak provider 非零退出")
          with zipfile.ZipFile(apk_path) as apk:
              bridge = apk.read("lib/arm64-v8a/libmaplesu_ultra_bridge.so")
              if len(bridge) < 1024:
                  raise SystemExit("FATAL: Ultra bridge missing or empty in APK")
              print(f"Ultra bridge: {len(bridge)} bytes SHA256={hashlib.sha256(bridge).hexdigest()}")
              for kmi in required:
                  path = f"assets/maplesu/l3/{kmi}/maplesu_l3.ko"
                  actual = hashlib.sha256(apk.read(path)).hexdigest()
                  module = provider["l3"]["modules"][kmi]
                  gate_ok = module["gateResult"]["ok"] is True
                  print(f"L3 {kmi}: gate={gate_ok} packagedSha256={actual}")
                  if not gate_ok or module["sha256"] != actual:
                      raise SystemExit(f"FATAL: {kmi} L3 门禁或入包哈希不一致")
          if not identity_ok or not native["coverageOk"] or so_old or bad:
              print("FATAL: native 身份、六 KMI 覆盖或包名门禁未通过", file=sys.stderr)
              sys.exit(1)
          PY
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          head -40 out/build-receipt.json

      - name: 上传产物与回执
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluewhale-native-${{ github.run_number }}
          path: |
            out/
            /tmp/payload-gate.log
            /tmp/userland.log
            /tmp/jni.log
            src/manager/build/jailbreakProviders/build.log
            src/manager/build/jailbreakProviders/build.json
            src/third_party/kernelsu/lkm/*.log
          if-no-files-found: warn
          retention-days: 14
