name: debug-native-full-log
on:
  workflow_dispatch:
  push:
    paths:
      - ".debug-trigger/**"
permissions:
  contents: write
  actions: read
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 解析 RUN_ID
        run: |
          set -euo pipefail
          RUN_ID=""
          if [ -f .debug-trigger/native-run-id ]; then
            RUN_ID="$(tr -d '[:space:]' < .debug-trigger/native-run-id)"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "auto" ]; then
            RUN_ID="$(gh run list --workflow=build-bluewhale-native.yml --branch="${GITHUB_REF_NAME}" --limit=1 --json databaseId -q '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ]; then echo "no run id" >&2; exit 1; fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - name: 取完整 job 日志并写回仓库
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          F=".ci-logs/native-${RUN_ID}-full.txt"
          { echo "run=$RUN_ID"; gh run view "$RUN_ID" --log 2>&1 || true; } > "$F"
          wc -c "$F"
          grep -n -m 20 -E '^[^ ]*: (e: |FAILURE|E: )' "$F" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "ci: full native log $RUN_ID" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
