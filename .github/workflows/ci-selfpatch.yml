name: ci-selfpatch

on:
  push:
    paths:
      - ".github/workflows/ci-selfpatch.yml"
      - ".apk-fetch/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装补丁
        run: |
          set -u
          mkdir -p .ci-logs
          L=.ci-logs/selfpatch.log
          : > "$L"
          curl -fsSL -o overlay/patch_bluewhale_32739_advisor.py https://aka.doubaocdn.com/s/OZcO4HdGVj >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32741_probe.py https://aka.doubaocdn.com/s/MUfiqnXzmI >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32741_diag.py https://aka.doubaocdn.com/s/bQmx2pNQeK >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32742_home.py https://aka.doubaocdn.com/s/BjPqdb4hm9 >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32743_clean.py https://aka.doubaocdn.com/s/eu4YmvIVs2 >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32744_diaglog.py https://aka.doubaocdn.com/s/wSwYxgR8ZW >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32745_clean.py https://aka.doubaocdn.com/s/uA8FJZVQf9 >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32746_statcard.py https://aka.doubaocdn.com/s/qrgpYfKAnn >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32747_diag2.py https://aka.doubaocdn.com/s/CAFZZU9js5 >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32748_home3.py https://aka.doubaocdn.com/s/gUPUhc30H6 >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32749_home4.py https://aka.doubaocdn.com/s/jivJpbJJeU >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32750_nojb.py https://aka.doubaocdn.com/s/98BVvRa9wp >> "$L" 2>&1
          curl -fsSL -o overlay/patch_bluewhale_32741.py https://aka.doubaocdn.com/s/0kg8QyIXCa >> "$L" 2>&1
          echo "de056ebd13f0dbb99fdb26298b007f49c3c095723e98c77c4a3014c52b033b54  overlay/patch_bluewhale_32739_advisor.py" | sha256sum -c - >> "$L" 2>&1
          echo "fb9a2d2742592f76d96c938e4477d2bf7938bd080d5d4bed0480f6c6fe6ea7c6  overlay/patch_bluewhale_32741_probe.py" | sha256sum -c - >> "$L" 2>&1
          echo "ddab772510f213740db8b0038221ad7c7ec47be8d27884060af52ff5d68b0f50  overlay/patch_bluewhale_32741_diag.py" | sha256sum -c - >> "$L" 2>&1
          echo "7fcc0294d7dd4fcbefac6200dc583d9a84eda47aa19abf3507e2ae8952c3a8b7  overlay/patch_bluewhale_32742_home.py" | sha256sum -c - >> "$L" 2>&1
          echo "27435ea84545517e602f235827786c418da6e7b6d426d33c8bb8e62c44e5a0e4  overlay/patch_bluewhale_32743_clean.py" | sha256sum -c - >> "$L" 2>&1
          echo "2cb0cf7349a932fb84c8d3165fb7bd320acaf512ea15fa2449d894d037720db9  overlay/patch_bluewhale_32744_diaglog.py" | sha256sum -c - >> "$L" 2>&1
          echo "78d0cb95eea1a316ed4c30f41477fbdeae0f7c6d8158935e136550ff5dfde6e0  overlay/patch_bluewhale_32745_clean.py" | sha256sum -c - >> "$L" 2>&1
          echo "91f977892ca9e5f53ddfe86eb77eec8b02d95e259df9e9da76208dc78f2ccac9  overlay/patch_bluewhale_32741.py" | sha256sum -c - >> "$L" 2>&1
          python3 -m py_compile overlay/*.py >> "$L" 2>&1 && echo py-ok >> "$L"
          echo "e1bf996731418e209b16e93e324228901160bf8e665325ff0814d8f8978fd538  overlay/patch_bluewhale_32746_statcard.py" | sha256sum -c - >> "$L" 2>&1
          echo "1641ff7fa594a403d9db7117effc88a010f6c7f7a00e79e8d08a7da4f0a01168  overlay/patch_bluewhale_32747_diag2.py" | sha256sum -c - >> "$L" 2>&1
          echo "9da231fa1671247a7965879a3a2b8179f9a0257fd5a2293b4f2ea3a60e291282  overlay/patch_bluewhale_32748_home3.py" | sha256sum -c - >> "$L" 2>&1
          echo "7892e1c868c7c6711b37fc2f0c288c1c7ce82bf45518810dff4f836269464da8  overlay/patch_bluewhale_32749_home4.py" | sha256sum -c - >> "$L" 2>&1
          echo "5d449b8e5b76b0fa2743847809b959c7c8705ed754fec1987e405df5ac119126  overlay/patch_bluewhale_32750_nojb.py" | sha256sum -c - >> "$L" 2>&1
          git config user.name "bluewhale-ci"
          git config user.email "ci@bluewhale.local"
          git add overlay/patch_bluewhale_32739_advisor.py overlay/patch_bluewhale_32741_probe.py overlay/patch_bluewhale_32741_diag.py overlay/patch_bluewhale_32742_home.py overlay/patch_bluewhale_32743_clean.py overlay/patch_bluewhale_32744_diaglog.py overlay/patch_bluewhale_32745_clean.py overlay/patch_bluewhale_32746_statcard.py overlay/patch_bluewhale_32747_diag2.py overlay/patch_bluewhale_32748_home3.py overlay/patch_bluewhale_32749_home4.py overlay/patch_bluewhale_32750_nojb.py overlay/patch_bluewhale_32741.py "$L"
          git commit -m "ci: 32750 drop self-jailbreak entry points" >> "$L" 2>&1 || echo COMMITFAIL >> "$L"
          git push origin "HEAD:${GITHUB_REF_NAME}" >> "$L" 2>&1 || echo PUSHFAIL >> "$L"
          tail -50 "$L"
      - name: 取件（存在 .apk-fetch/tag 时）
        if: hashFiles('.apk-fetch/tag') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          mkdir -p out tmp .ci-logs
          RID=$(grep -o '[0-9][0-9]*' .apk-fetch/run-id | head -1)
          NAME=$(head -1 .apk-fetch/name)
          TAG=$(head -1 .apk-fetch/tag)
          APKNAME=$(head -1 .apk-fetch/apk)
          echo "fetch run=$RID artifact=$NAME tag=$TAG"
          gh run download "$RID" -n "$NAME" -D out
          find out -name '*.apk' -o -name '*.apk.zip' | head -5
          PICK=$(find out -name '*.apk' | head -1)
          cp "$PICK" "tmp/$APKNAME"
          SIZE=$(stat -c%s "tmp/$APKNAME")
          SHA=$(sha256sum "tmp/$APKNAME" | cut -d' ' -f1)
          printf 'run=%s\nartifact=%s\nunsigned-sha=%s size=%s\n' "$RID" "$NAME" "$SHA" "$SIZE" > ".ci-logs/apk-${RID}.txt"
          gh release create "$TAG" --title "$TAG" --notes "bluewhale $TAG" 2>/dev/null || true
          gh release upload "$TAG" "tmp/$APKNAME" --clobber
          printf 'url=%s\n' "https://github.com/$GH_REPO/releases/download/$TAG/$APKNAME" >> ".ci-logs/apk-${RID}.txt"
          cat ".ci-logs/apk-${RID}.txt"
          git config user.name "bluewhale-ci"
          git config user.email "ci@bluewhale.local"
          git add ".ci-logs/apk-${RID}.txt"
          git commit -m "ci: apk receipt ${RID}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
