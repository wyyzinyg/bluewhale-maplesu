name: debug-sdk-log

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        default: "45988296824"
  push:
    paths:
      - ".debug-sdk-trigger/**"

permissions:
  contents: write
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ inputs.run_id || '45988296824' }}
    steps:
      - uses: actions/checkout@v4
      - name: dump log
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          F=".ci-logs/sdk-${RUN_ID}-full.txt"
          {
            echo "run=$RUN_ID"
            gh run view "$RUN_ID" --log || true
          } > "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "ci: sdk full log $RUN_ID" || true
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || true
