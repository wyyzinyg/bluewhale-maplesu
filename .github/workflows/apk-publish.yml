name: apk-publish

on:
  push:
    paths:
      - ".apk-trigger/**"
  workflow_dispatch:
    inputs:
      run_id:
        description: "native run id"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: resolve run id
        run: |
          RUN_ID="$(grep -oE '[0-9]{8,}' .apk-trigger/run-id | head -1)"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "resolved: $RUN_ID"
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifact
      - name: inspect
        run: find artifact -type f -name '*.apk' -exec ls -l {} \;
      - name: publish apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          APK=$(find artifact -type f -name '*.apk' | head -1 || true)
          [ -z "$APK" ] && { echo NO_APK; exit 1; }
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          NAME=bluewhale-manager-v3.22.4-bw-32743.apk
          cp "$APK" "/tmp/$NAME"
          REL=bw32743
          echo "--- release ---"
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" -t "BlueWhale 3.22.4-bw 32743" -n "build run $RUN_ID" || true
          gh release upload "$REL" "/tmp/$NAME" --clobber && echo RELEASE_OK || echo RELEASE_FAIL
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${REL}/${NAME}"
          code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 60 "$URL" || echo 000)
          echo "release url http: $code"
          if [ "$code" != "200" ]; then
            echo "--- catbox ---"
            URL=$(curl -fsS --max-time 900 -A "Mozilla/5.0" -F "reqtype=fileupload" \
              -F "fileToUpload=@/tmp/${NAME};filename=${NAME}" https://catbox.moe/user/api.php 2>&1 || true)
            echo "catbox: $URL"
          fi
          mkdir -p .ci-logs
          {
            echo "run=$RUN_ID"
            echo "url=$URL"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } > ".ci-logs/apk-${RUN_ID}.txt"
          cat ".ci-logs/apk-${RUN_ID}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".ci-logs/apk-${RUN_ID}.txt"
          git commit -m "ci: apk link ${RUN_ID}" || true
          git push origin HEAD:${GITHUB_REF_NAME} || true
