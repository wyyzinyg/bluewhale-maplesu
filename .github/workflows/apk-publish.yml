name: apk-publish

on:
  push:
    paths:
      - ".apk-trigger/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: rid
        run: echo "runid=$(cat .apk-trigger/run-id | tr -d ' \n')" >> "$GITHUB_OUTPUT"
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.rid.outputs.runid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: bluewhale-native-36
          path: out
      - name: 校验并上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p tmp .ci-logs
          R="${{ steps.rid.outputs.runid }}"
          cd out
          APK=$(ls *.apk | head -1)
          SIZE=$(stat -c%s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cp "$APK" ../tmp/bluewhale-manager-v3.22.5-bw-32744.apk
          cd ..
          echo "unsigned-sha=$SHA size=$SIZE" > ".ci-logs/apk-${R}.txt"
          gh release create bw32744 --title "32744 / 3.22.5-bw" --notes "diagnostics log" 2>/dev/null || true
          gh release upload bw32744 "tmp/bluewhale-manager-v3.22.5-bw-32744.apk" --clobber
          URL=$(gh release view bw32744 --json assets -q '.assets[0].url')
          echo "url=$URL" >> ".ci-logs/apk-${R}.txt"
          echo "sha256=$SHA" >> ".ci-logs/apk-${R}.txt"
          echo "size=$SIZE" >> ".ci-logs/apk-${R}.txt"
          git config user.name "bluewhale-ci"
          git config user.email "ci@bluewhale.local"
          git add ".ci-logs/apk-${R}.txt"
          git commit -m "ci: apk receipt ${R}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
          cat ".ci-logs/apk-${R}.txt"
